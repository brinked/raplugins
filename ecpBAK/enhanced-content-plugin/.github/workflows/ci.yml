name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check all PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './docs/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  standards:
    name: Coding Standards & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPCS
        run: composer phpcs

      - name: PHPStan
        run: composer phpstan
